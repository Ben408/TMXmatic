# Reference copy only - LDW must NOT dispatch Okapi jobs to Ben408/TMXmatic.
# Users fork ldw-okapi-workflows and configure their fork in LDW Settings.
name: okapi-ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Okapi operation id (convert, merge, qa, terms)"
        required: true
        type: string
      input_url:
        description: "URL to download input file"
        required: true
        type: string
      options_json:
        description: "Operation options JSON"
        required: false
        type: string
        default: "{}"

permissions:
  contents: read

concurrency:
  group: okapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-okapi:
    runs-on: ubuntu-latest
    env:
      OKAPI_VERSION: "1.48.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Okapi tikal
        run: |
          curl -fsSL -o okapi.zip "https://okapiframework.org/binaries/main/${OKAPI_VERSION}/okapi-apps_gtk2-linux-x86_64_${OKAPI_VERSION}.zip"
          unzip -q okapi.zip -d "$HOME/okapi"
          echo "$HOME/okapi" >> "$GITHUB_PATH"
          printf '#!/bin/bash\nexec "$HOME/okapi/tikal.sh" "$@"\n' > "$HOME/okapi/tikal"
          chmod +x "$HOME/okapi/tikal" "$HOME/okapi/tikal.sh"

      - name: Download input
        env:
          INPUT_URL: ${{ github.event.inputs.input_url }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_URL" =~ raw\.githubusercontent\.com/([^/]+)/([^/]+)/([^/]+)/(.+) ]]; then
            owner="${BASH_REMATCH[1]}"
            repo="${BASH_REMATCH[2]}"
            ref="${BASH_REMATCH[3]}"
            path="${BASH_REMATCH[4]}"
            input_file=$(basename "$path")
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${ref}" \
              -o "$input_file"
          else
            input_file="input.bin"
            curl -fsSL "$INPUT_URL" -o "$input_file"
          fi
          echo "input_file=$input_file" >> "$GITHUB_ENV"

      - name: Run operation
        shell: bash
        run: |
          set -euo pipefail
          OP="${{ github.event.inputs.operation }}"
          case "$OP" in
            convert) tikal -x "$input_file" -od . -nocopy -sl en-us -tl fr-fr && mv "${input_file}.xlf" converted.xlf ;;
            merge) tikal -m "$input_file" -od . && test -e merged-output || cp -a . merged-output ;;
            qa) tikal -x "$input_file" -od . -seg -nocopy ;;
            terms) tikal -x "$input_file" -od . -tt -nocopy ;;
            *) echo "Unknown operation: $OP"; exit 2 ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: okapi-${{ github.event.inputs.operation }}-artifacts
          path: |
            converted.xlf
            merged-output
            qa-report.html
            terms.tbx
          if-no-files-found: ignore
          retention-days: 7
